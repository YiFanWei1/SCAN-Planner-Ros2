scan_planner_node:
  ros__parameters:
    use_sim_time: false
    fsm.navi_mode: 3
    # Distance-triggered replanning: about 3 Hz at the bag's ~0.6 m/s speed.
    fsm.thresh_replan: 0.20
    # Avoid a 100 Hz failure loop; enter the safety stop after about 2 seconds.
    fsm.replan_retry_interval: 0.10
    fsm.max_replan_fail_count: 20
    # After a bounded failure burst, stop first and retry the retained target
    # at low duty cycle instead of depending on a materially changed /plan.
    fsm.auto_retry_after_failures: true
    fsm.failure_retry_cooldown: 1.0
    fsm.reference_path_min_distance: 0.15
    fsm.clear_map_on_new_path: false
    # /lio_odom_hf follows nav_msgs/Odometry semantics: twist is expressed in
    # child_frame_id=base_link. Rotate it into camera_init before planning.
    fsm.odom_twist_in_body_frame: true
    # Keep XY and dynamics tied to live odometry, but start each reference-path
    # replan at the raised terrain-path Z instead of drawing an artificial ramp
    # from raw odometry Z. Reject large corrections to avoid wrong-floor snaps.
    fsm.project_reference_start_z: true
    fsm.reference_start_z_max_correction: 0.60
    # Constrain the local B-spline's initial derivative to the nearby raised
    # 3-D reference path. This removes stair-impact/LIO lateral velocity while
    # preserving the climb/descent rate implied by the terrain slope.
    fsm.project_reference_start_velocity: true
    fsm.reference_velocity_tangent_half_window: 0.40
    fsm.reference_start_velocity_max: 0.75
    # Final dynamic-feasibility threshold is manager.max_acc (0.5) plus this
    # tolerance, giving 3.0 m/s^2 for the fast stair bag test.
    optimization.acc_tolerance: 2.5
    grid_map.frame_id: camera_init
    grid_map.sliding_map_frame_id: sliding_map
    grid_map.sensor_type: lidar
    grid_map.cloud_is_world: false
    grid_map.need_extrinsic: false
    # Prevent the first trajectory from racing the lidar fusion timer. SCAN
    # starts planning only after two valid clouds have updated occupancy.
    grid_map.map_ready_min_cloud_updates: 2
    # Experimental 0.40 m path lift for comparison with the normal 0.30 m
    # physical base_link height; the segmenter still preserves source Z.
    grid_map.body_height: 0.40
    # Restore the normal Go2 double-cylinder collision envelope.
    grid_map.double_cylinder_radius: 0.25
    grid_map.double_cylinder_offset: 0.18
    grid_map.obstacles_inflation_z_up: 0.00
    grid_map.obstacles_inflation_z_down: 0.00
    # Optional self/near-body point exclusion. Disable this on the real robot
    # when close-proximity obstacle perception is required.
    grid_map.body_exclusion_enabled: true
    grid_map.body_exclusion_half_length: 0.55
    grid_map.body_exclusion_half_width: 0.40
    grid_map.body_exclusion_z_down: 0.35
    grid_map.body_exclusion_z_up: 0.35
    # Forget stale occupied voxels produced by moving objects. A maximally
    # occupied voxel crosses the occupancy threshold in about 1.0 s when it
    # is no longer hit, while a stopped point-cloud stream never erases map.
    grid_map.occupancy_decay_enabled: true
    # Preserve stale occupied voxels behind the robot. Only the body-frame
    # front half of the existing 0.8-5.0 m decay shell may decay with time.
    grid_map.occupancy_decay_front_only: true
    grid_map.occupancy_decay_start: 0.8
    grid_map.occupancy_decay_interval: 0.1
    grid_map.occupancy_decay_min_range: 0.8
    grid_map.occupancy_decay_max_range: 5.0
    grid_map.occupancy_decay_sensor_timeout: 0.5
    grid_map.occupancy_decay_log_odds: -0.8472978604

closed_loop_controller:
  ros__parameters:
    use_sim_time: false
    trajectory_frame: camera_init
    trajectory_visualization_rate: 20.0
    trajectory_visualization_dt: 0.10
    max_vx: 0.30
    max_vy: 0.20
    max_vyaw: 0.50
    odom_timeout: 0.15
    trajectory_timeout: 0.50

real_go2_input_adapter:
  ros__parameters:
    use_sim_time: false
    world_frame: camera_init
    lidar_to_base_x: -0.15
    lidar_to_base_y: 0.0
    lidar_to_base_z: -0.21
    sync_tolerance: 0.05
    max_input_horizontal_speed: 8.0
    max_input_vertical_speed: 4.0
    odom_validation_window: 0.10
    # The recorded route descends from floor 5 to floor 1, so a large genuine
    # displacement from the startup height is expected. Frame-to-frame jumps
    # remain guarded by max_input_vertical_speed below.
    max_vertical_displacement_from_start: 20.0
    path_update_rate: 1.0
    path_endpoint_threshold: 0.30
    path_geometry_threshold: 0.20
    path_compare_horizon: 5.0
    # /plan stores terrain height while body_pose is the planning body center.
    # Keep this equal to grid_map.body_height so 3-D path projection selects
    # the correct stair floor before trimming away points behind the robot.
    path_body_height_offset: 0.40
    path_projection_vertical_weight: 1.0
    path_projection_max_xy_distance: 2.0
    path_projection_max_z_error: 1.0

cmd_vel_safety_gate:
  ros__parameters:
    use_sim_time: false
    enable_motion_on_start: false
    max_vx: 0.30
    max_vy: 0.20
    max_vyaw: 0.50
    odom_timeout: 0.15
    trajectory_timeout: 0.50
    # DataDisp is event-driven visualization data, not a periodic heartbeat.
    # Trajectory validity, odometry and raw-command timeouts remain enforced.
    require_planner_heartbeat: false
    planner_heartbeat_timeout: 4.00
    command_timeout: 0.15
    publish_rate: 100.0
