scan_planner_node:
  ros__parameters:
    use_sim_time: false
    fsm.navi_mode: 3
    fsm.reference_path_min_distance: 0.15
    fsm.clear_map_on_new_path: false
    grid_map.frame_id: camera_init
    grid_map.sliding_map_frame_id: sliding_map
    grid_map.sensor_type: lidar
    grid_map.cloud_is_world: false
    grid_map.need_extrinsic: false
    grid_map.body_height: 0.31
    grid_map.obstacles_inflation_z_up: 0.05
    grid_map.obstacles_inflation_z_down: 0.05

closed_loop_controller:
  ros__parameters:
    use_sim_time: false
    trajectory_frame: camera_init
    trajectory_visualization_rate: 20.0
    trajectory_visualization_dt: 0.10
    max_vx: 0.30
    max_vy: 0.20
    max_vyaw: 0.50
    odom_timeout: 0.15
    trajectory_timeout: 0.50

real_go2_input_adapter:
  ros__parameters:
    use_sim_time: false
    world_frame: camera_init
    lidar_to_base_x: -0.15
    lidar_to_base_y: 0.0
    lidar_to_base_z: -0.21
    sync_tolerance: 0.05
    max_input_horizontal_speed: 5.0
    max_input_vertical_speed: 2.0
    odom_validation_window: 0.10
    max_vertical_displacement_from_start: 2.0
    path_update_rate: 1.0
    path_endpoint_threshold: 0.30
    path_geometry_threshold: 0.20
    path_compare_horizon: 5.0

cmd_vel_safety_gate:
  ros__parameters:
    use_sim_time: false
    enable_motion_on_start: false
    max_vx: 0.30
    max_vy: 0.20
    max_vyaw: 0.50
    odom_timeout: 0.15
    trajectory_timeout: 0.50
    # DataDisp is event-driven visualization data, not a periodic heartbeat.
    # Trajectory validity, odometry and raw-command timeouts remain enforced.
    require_planner_heartbeat: false
    planner_heartbeat_timeout: 4.00
    command_timeout: 0.15
    publish_rate: 100.0
